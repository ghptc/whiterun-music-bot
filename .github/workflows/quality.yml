name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and validate FFmpeg/libopus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=48000:cl=stereo -t 0.1 -c:a libopus -f opus -y /dev/null
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout=5m
      - run: go test -race ./... -count=1 -timeout=5m
      - name: Coverage
        run: |
          go test ./... -covermode=atomic -coverprofile=coverage.out -timeout=5m
          go tool cover -func=coverage.out | tee coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
            coverage.html
  sqlite-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Real SQLite files, migrations, rollback and recovery
        run: go test -race ./internal/storage -count=1 -v -timeout=3m
